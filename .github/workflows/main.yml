name: Build MikuPan Android APK

on:
  workflow_dispatch: # Allows you to trigger the build manually with a button

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MikuPan Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build make zip bash pkg-config

      - name: Install Android SDK 35 & NDK r28c
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Build Prebuilt FFmpeg (arm64-v8a with 16KB Page Size)
        uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: extern/ffmpeg/android/arm64-v8a
          key: ffmpeg-android-arm64-16kb-v1

      - name: Compile FFmpeg if not cached
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export API=21

          git clone --depth 1 --branch n7.1 https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg
          cd /tmp/ffmpeg

          ./configure \
            --prefix="$GITHUB_WORKSPACE/extern/ffmpeg/android/arm64-v8a" \
            --enable-cross-compile \
            --target-os=android \
            --arch=aarch64 \
            --cc="$TOOLCHAIN/bin/aarch64-linux-android${API}-clang" \
            --cxx="$TOOLCHAIN/bin/aarch64-linux-android${API}-clang++" \
            --ld="$TOOLCHAIN/bin/aarch64-linux-android${API}-clang" \
            --ar="$TOOLCHAIN/bin/llvm-ar" \
            --ranlib="$TOOLCHAIN/bin/llvm-ranlib" \
            --strip="$TOOLCHAIN/bin/llvm-strip" \
            --nm="$TOOLCHAIN/bin/llvm-nm" \
            --enable-shared \
            --disable-static \
            --disable-programs \
            --disable-doc \
            --disable-avdevice \
            --disable-postproc \
            --disable-network \
            --extra-ldflags="-Wl,-z,max-page-size=16384"

          make -j$(nproc)
          make install

      - name: Configure and Build MikuPan-apk
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"

          cmake -S . -B cmake-build-android-arm64 -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$(which ninja)" \
            -DBASH_EXECUTABLE="$(which bash)" \
            -DMAKE_EXECUTABLE="$(which make)" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DSDL_ANDROID_HOME="$ANDROID_HOME" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build cmake-build-android-arm64 --target MikuPan-apk -j$(nproc)

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: MikuPan-Android-APK
          path: cmake-build-android-arm64/MikuPan.apk
